<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Resume</title>
    <link rel="stylesheet" href="../css/main.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script src="../js/firebase-config.js"></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/dark_mode.js"></script>

    <style>
        .resume-section {
            padding: 50px 20px;
            text-align: center;
        }

        .resume-container {
            max-width: 800px;
            margin: 0 auto;
            background: #f9f9f9;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .download-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="resume-section">
            <h1>My Resume</h1>
            <div class="resume-container">
                <p>Here is an overview of my professional experience and education.</p>
                <!-- Placeholder for Resume Content or PDF Embed -->
                <iframe src="" width="100%" height="500px" style="border: none;">
                    <p>Your browser does not support PDFs. <a href="#">Download the PDF</a>.</p>
                </iframe>

                <a href="#" class="download-btn">Download Resume</a>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
</body>

</html>
