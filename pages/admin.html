<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/main.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

    <script src="../js/firebase-config.js"></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/dark_mode.js"></script>
    <script src="../js/admin.js" defer></script>

    <script>
        // Protect Route
        document.addEventListener('DOMContentLoaded', () => {
            firebase.auth().onAuthStateChanged(user => {
                if (!user) {
                    window.location.href = 'login.html';
                } else {
                    document.getElementById('admin-email').textContent = user.email;
                }
            });
        });
    </script>
</head>

<body>
    <div id="header-placeholder"></div>

    <h1 class="title">Welcome, <span id="admin-email">Admin</span>!</h1>
    <p class="title">You are now logged in as an admin.</p>

    <!-- File Upload Form -->
    <div class="form-container">
        <form class="form" id="fileUploadForm">
            <span class="form-title">Select Photo:</span>
            <p class="form-paragraph">File should be an image</p>
            <label for="file-input" class="drop-container">
                <span class="drop-title">Drop files here</span>
                or
                <input type="file" id="photo" accept="image/*" multiple class="file-input">
            </label>
            <br>
            <button type="button" id="nextButton" class="next-button">
                <span class="labelx">Next</span>
                <span class="iconx">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                        <path fill="none" d="M0 0h24v24H0z"></path>
                        <path fill="currentColor"
                            d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z">
                        </path>
                    </svg>
                </span>
            </button>
        </form>
    </div>

    <!-- Message container for displaying upload results -->
    <div id="uploadMessages" class="upload-messages hidden"></div>

    <!-- Scrollable Photo Preview -->
    <div id="photoPreviewContainer" class="photo-preview-container hidden">
        <h2 class="title">Manage Selected Photos</h2>
        <div class="photo-preview-scroll">
            <div id="photoPreviewList" class="photo-gallery"></div>
        </div>
        <div class="actions">
            <button class="action-button-upload" id="uploadAllButton">
                Upload All
                <div class="icon">
                    <svg height="24" width="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 0h24v24H0z" fill="none"></path>
                        <path d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z"
                            fill="currentColor"></path>
                    </svg>
                </div>
            </button>
            <button id="removeAllButton" class="action-button-remove">Remove All</button>
        </div>
    </div>

    <div id="footer-placeholder"></div>
</body>

</html>
